[package]
name = "openworkers-runtime-quickjs"
version = "0.14.0"
edition = "2024"

[features]
actix = ["openworkers-core/actix"]

[dependencies]

# Common types
# openworkers-core = { path = "../openworkers-core" }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.14.0" }

# QuickJS JavaScript engine
rquickjs = { version = "0.10", features = ["full-async", "parallel"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP types
bytes = { version = "1.11", features = ["serde"] }

# Crypto
ring = "0.17"
uuid = { version = "1.17", features = ["v4"] }
url = "2.5.8"
base64 = "0.22"

[dev-dependencies]

# ESM -> classic script lowering, the same pass every runtime uses
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform", tag = "v0.1.0" }
sha2 = "0.10"
